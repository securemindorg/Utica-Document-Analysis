<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Stylometrics Text Analyzer</title>
    <!-- External Libraries for parsing PDF and DOCX files client-side -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: #2c3e50; }
        .input-section { margin-bottom: 25px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        textarea {
            width: 100%;
            height: 160px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .file-upload-box {
            border: 2px dashed #bbb;
            padding: 20px;
            text-align: center;
            background: #fafafa;
            border-radius: 4px;
            margin-top: 10px;
        }
        .or-divider {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
            color: #777;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background-color: #0052a3; }
        
        /* Analysis Card Styles */
        .results-card {
            margin-top: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }
        .card-header {
            background: #f2f4f8;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h2 { margin: 0; font-size: 18px; color: #2c3e50; }
        .metric-row {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .metric-row:last-child { border-bottom: none; }
        .metric-label {
            font-weight: bold;
            font-size: 15px;
            color: #333;
            margin-bottom: 4px;
        }
        .metric-value {
            font-weight: bold;
            color: #0066cc;
        }
        .metric-explanation {
            font-size: 13.5px;
            color: #555;
            margin-top: 4px;
            line-height: 1.4;
        }
        
        /* Verdict Status Colors */
        .status-human { color: #28a745; font-weight: bold; }
        .status-review { color: #856404; font-weight: bold; }
        .status-hybrid { color: #d97706; font-weight: bold; }
        .status-bot { color: #dc3545; font-weight: bold; }
        .error-msg { color: #dc3545; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>University Stylometrics & AI Artifact Analyzer</h1>
    <p>Paste your text below or upload a document (<strong>.txt, .pdf, .docx</strong>) to calculate character entropy, sentence variance, lexical diversity, and scan for synthetic AI patterns.</p>
    
    <div class="input-section">
        <label for="textInput">Option 1: Paste Text</label>
        <textarea id="textInput" placeholder="Paste essay or assignment text here..."></textarea>
        
        <div class="or-divider">— OR —</div>
        
        <label for="fileInput">Option 2: Upload Document (.txt, .pdf, .docx)</label>
        <div class="file-upload-box">
            <input type="file" id="fileInput" accept=".txt, .pdf, .docx">
        </div>
        
        <button onclick="processInput()">Run Analysis</button>
        <div id="errorMessage" class="error-msg"></div>
    </div>

    <div id="resultsContainer"></div>
</div>

<script>
// Configure PDF.js worker URL
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const AI_SIGNATURES = new Set([
    'delve', 'testament', 'pivotal', 'foster', 'synergy', 'bespoke', 
    'demystify', 'furthermore', 'moreover', 'in conclusion', 'tapestry',
    'beacon', 'realm', 'multifaceted', 'underscore'
]);

function calculateShannonEntropy(text) {
    if (!text) return 0.0;
    const totalChars = text.length;
    const counts = {};
    for (let char of text) {
        counts[char] = (counts[char] || 0) + 1;
    }
    let entropy = 0.0;
    for (let char in counts) {
        const p = counts[char] / totalChars;
        entropy -= p * Math.log2(p);
    }
    return entropy;
}

function deepArtifactCheck(text) {
    let penalty = 0;
    const flags = [];
    
    // 1. Academic/arXiv/DOI link hallucination trends
    const arxivRegex = /(arxiv:\s*\d{4}\.\d{4,5}|arxiv\.org\/abs\/\d{4}\.\d{4,5}|doi\.org\/10\.\d{4})/gi;
    const arxivFinds = text.match(arxivRegex);
    if (arxivFinds) {
        penalty += 25;
        flags.push(`Synthetic Citation Pattern (${arxivFinds.length} found)`);
    }
    
    // 2. Rigid structural headers
    const headerRegex = /^(Concern|Introduction|The Concern|References):/gm;
    const headerMatches = text.match(headerRegex);
    if (headerMatches) {
        const uniqueHeaders = [...new Set(headerMatches.map(h => h.replace(':', '')))];
        penalty += 10;
        flags.push(`LLM Section Headers: [${uniqueHeaders.join(', ')}]`);
    }

    // 3. Vocabulary Tells
    const cleanWords = text.split(/\s+/).map(w => w.replace(/[^\w]/g, '').toLowerCase()).filter(Boolean);
    const foundBuzzwords = cleanWords.filter(w => AI_SIGNATURES.has(w));
    const uniqueBuzzwords = [...new Set(foundBuzzwords)];
    if (uniqueBuzzwords.length >= 2) {
        penalty += Math.min(20, uniqueBuzzwords.length * 5);
        flags.push(`AI Vocabulary Overuse: [${uniqueBuzzwords.join(', ')}]`);
    }

    // NEW 4. Repeated Sentence Openers (e.g., "It is...", "It can...", "It has...")
    const sentences = text.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
    if (sentences.length >= 3) {
        let maxRepetitiveStarts = 1;
        let currentCount = 1;
        let lastFirstWord = "";

        for (let i = 0; i < sentences.length; i++) {
            const firstWord = sentences[i].split(/\s+/)[0]?.toLowerCase();
            if (firstWord && firstWord === lastFirstWord) {
                currentCount++;
                if (currentCount > maxRepetitiveStarts) maxRepetitiveStarts = currentCount;
            } else {
                currentCount = 1;
                lastFirstWord = firstWord;
            }
        }

        if (maxRepetitiveStarts >= 3) {
            penalty += 25;
            flags.push(`Repetitive Sentence Syntax (${maxRepetitiveStarts} consecutive sentences start with '${lastFirstWord}')`);
        }
    }

    // NEW 5. High Keyphrase Recalling / Phrase Redundancy
    // Checks if the text constantly loops back to the exact same subject terms
    const wordFreq = {};
    const stopwords = new Set(['the', 'is', 'at', 'which', 'on', 'a', 'an', 'and', 'or', 'to', 'in', 'of', 'for', 'with', 'be', 'has', 'been', 'it', 'by']);
    cleanWords.forEach(w => {
        if (!stopwords.has(w) && w.length > 2) {
            wordFreq[w] = (wordFreq[w] || 0) + 1;
        }
    });

    // If a single non-stopword accounts for over 6% of short text, flag phrase repetition
    const maxFreq = Math.max(...Object.values(wordFreq), 0);
    if (cleanWords.length < 100 && maxFreq >= 4) {
        penalty += 20;
        const repeatedWord = Object.keys(wordFreq).find(key => wordFreq[key] === maxFreq);
        flags.push(`Monotonous Subject Focus (Word '${repeatedWord}' repeated ${maxFreq}x in short span)`);
    }

    return { penalty, flags };
}

function analyzeDocument(text, fileName = "Pasted Text") {
    const sentences = text.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
    const words = text.split(/\s+/).map(w => w.replace(/[^\w]/g, '').toLowerCase()).filter(Boolean);
    
    const totalWords = words.length;
    const totalSentences = sentences.length;
    
    if (totalWords < 30 || totalSentences < 2) {
        throw new Error("Text is too short for a reliable analysis. Please provide at least 30 words and 2 sentences.");
    }
    
    const entropy = calculateShannonEntropy(text);
    const lexDiv = (new Set(words)).size / totalWords;
    
    const lengths = sentences.map(s => s.split(/\s+/).filter(Boolean).length);
    const meanLen = lengths.reduce((a, b) => a + b, 0) / totalSentences;
    const variance = lengths.reduce((a, b) => a + Math.pow(b - meanLen, 2), 0) / totalSentences;
    
    // CALIBRATED BASE WEIGHTS:
    // Increased variance divisor scale to 85 so short texts don't inflate easily
    const vScore = Math.min(30, (variance / 85) * 30);
    const dScore = Math.min(30, (lexDiv / 0.75) * 30);
    
    // Lower base score to 25 to force artifacts and stylometrics to earn human status
    const baseScore = 25 + vScore + dScore;
    
    const { penalty, flags } = deepArtifactCheck(text);
    const finalScore = Math.max(0, Math.min(100, baseScore - penalty));
    
    let verdict = "";
    let statusClass = "";
    if (finalScore > 75 && flags.length === 0) {
        verdict = "Highly Likely Human";
        statusClass = "status-human";
    } else if (finalScore >= 55) {
        verdict = "Likely Human (Review Manually)";
        statusClass = "status-review";
    } else if (finalScore >= 40) {
        verdict = "Suspected AI Hybrid / Style Masked";
        statusClass = "status-hybrid";
    } else {
        verdict = "Highly Likely AI / Bot";
        statusClass = "status-bot";
    }

    const entropyExp = `Measures character-level randomness. A value of <strong>${entropy.toFixed(2)}</strong> reflects the character distribution predictability. Standard prose ranges from 4.0 to 5.2. Modern AI and formal human prose both reside in this domain, making character entropy useful primarily as a baseline profile.`;
    
    const lexDivExp = `Measures vocabulary richness. A ratio of <strong>${lexDiv.toFixed(2)}</strong> indicates that <strong>${Math.round(lexDiv * 100)}%</strong> of the words used in this piece are unique.`;
    
    const sentVarExp = `Measures structural rhythm. A variance score of <strong>${variance.toFixed(1)}</strong> reflects ${variance > 50 ? 'significant variation between short and long sentences—a natural hallmark of human writing.' : 'uniform or robotic sentence rhythms.'}`;
    
    const humanPercExp = `An overall composite rating of <strong>${finalScore.toFixed(1)}%</strong> derived from combining sentence variance, vocabulary richness, and artifact penalties.`;
    
    const flagsExp = flags.length > 0 
        ? `The scan detected specific structural artifacts: <strong>${flags.join(', ')}</strong>.`
        : `No synthetic citation patterns, rigid headers, repetitive syntax, or signature AI buzzwords were detected.`;

    return {
        fileName,
        entropy: entropy.toFixed(2),
        lexDiv: lexDiv.toFixed(2),
        sentVar: variance.toFixed(1),
        score: finalScore.toFixed(1),
        verdict,
        statusClass,
        entropyExp,
        lexDivExp,
        sentVarExp,
        humanPercExp,
        flagsExp
    };
}

async function processInput() {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.innerText = "";
    
    const pastedText = document.getElementById('textInput').value.trim();
    const fileInput = document.getElementById('fileInput');
    
    try {
        let textToAnalyze = "";
        let name = "Pasted Text";
        
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            name = file.name;
            const ext = name.split('.').pop().toLowerCase();
            
            if (ext === 'txt') {
                textToAnalyze = await file.text();
            } else if (ext === 'docx') {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                textToAnalyze = result.value;
            } else if (ext === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let extractedText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const pageText = content.items.map(item => item.str).join(" ");
                    extractedText += pageText + "\n";
                }
                textToAnalyze = extractedText;
            } else {
                throw new Error("Unsupported file format. Please upload a .txt, .docx, or .pdf file.");
            }
        } else if (pastedText.length > 0) {
            textToAnalyze = pastedText;
        } else {
            throw new Error("Please paste text or select a file to analyze.");
        }

        const res = analyzeDocument(textToAnalyze, name);
        renderCard(res);
        
    } catch (err) {
        errorDiv.innerText = err.message;
    }
}

function renderCard(res) {
    const html = `
        <div class="results-card">
            <div class="card-header">
                <h2>Analysis Results: ${res.fileName}</h2>
                <span class="${res.statusClass}">${res.verdict}</span>
            </div>
            
            <div class="metric-row">
                <div class="metric-label">Human Authenticity Score: <span class="metric-value">${res.score}%</span></div>
                <div class="metric-explanation">${res.humanPercExp}</div>
            </div>
            
            <div class="metric-row">
                <div class="metric-label">Shannon Character Entropy: <span class="metric-value">${res.entropy}</span></div>
                <div class="metric-explanation">${res.entropyExp}</div>
            </div>
            
            <div class="metric-row">
                <div class="metric-label">Lexical Diversity: <span class="metric-value">${res.lexDiv}</span></div>
                <div class="metric-explanation">${res.lexDivExp}</div>
            </div>
            
            <div class="metric-row">
                <div class="metric-label">Sentence Length Variance: <span class="metric-value">${res.sentVar}</span></div>
                <div class="metric-explanation">${res.sentVarExp}</div>
            </div>
            
            <div class="metric-row">
                <div class="metric-label">Flags Triggered</div>
                <div class="metric-explanation">${res.flagsExp}</div>
            </div>
        </div>
    `;
    document.getElementById('resultsContainer').innerHTML = html;
}
</script>

</body>
</html>
